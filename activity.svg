<svg xmlns="http://www.w3.org/2000/svg" width="990" height="230" viewBox="0 0 990 230" fill="none">
  <defs>
    <linearGradient id="actBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="actBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="988" height="228" x="1" y="1" rx="14" fill="url(#actBg)" stroke="url(#actBorder)" stroke-width="1.5"/>

  <!-- Title & Stats Header -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="17" font-weight="700" fill="#22D3EE">
    📊 Contribution Activity Graph (2024 - 2026)
  </text>
  <text x="955" y="38" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">
    <tspan fill="#34D399" font-weight="bold">● Active Streak: 120+ Days</tspan> | High Velocity
  </text>

  <!-- Activity Area Path -->
  <g transform="translate(35, 60)">
    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="30" x2="920" y2="30" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="70" x2="920" y2="70" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="0" y1="110" x2="920" y2="110" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Wave Graph Fill & Line -->
    <path d="M 0,110 Q 75,90 150,75 T 300,50 T 450,20 T 600,60 T 750,30 T 920,15 L 920,130 L 0,130 Z" fill="url(#areaGrad)"/>
    <path d="M 0,110 Q 75,90 150,75 T 300,50 T 450,20 T 600,60 T 750,30 T 920,15" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Data Points -->
    <circle cx="150" cy="75" r="4" fill="#00F0FF"/>
    <circle cx="300" cy="50" r="4" fill="#38BDF8"/>
    <circle cx="450" cy="20" r="5" fill="#A855F7"/>
    <circle cx="600" cy="60" r="4" fill="#C084FC"/>
    <circle cx="750" cy="30" r="5" fill="#00F0FF"/>
    <circle cx="920" cy="15" r="5" fill="#34D399"/>

    <!-- Month Labels -->
    <g transform="translate(0, 145)" font-family="Consolas, monospace" font-size="11" fill="#64748B">
      <text x="10">Jan</text>
      <text x="160">Mar</text>
      <text x="310">May</text>
      <text x="460">Jul</text>
      <text x="610">Sep</text>
      <text x="760">Nov</text>
      <text x="900">Present</text>
    </g>
  </g>
</svg>

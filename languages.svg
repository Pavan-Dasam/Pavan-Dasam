<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="titleGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="493" height="193" x="1" y="1" rx="14" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="17" font-weight="700" fill="url(#titleGrad2)">
    💻 Most Used Languages
  </text>

  <!-- Progress Bar (Combined) -->
  <g transform="translate(30, 56)">
    <rect width="435" height="12" rx="6" fill="#1E293B"/>
    <rect width="195" height="12" rx="6" fill="#3572A5"/>
    <rect x="195" width="130" height="12" fill="#B07219"/>
    <rect x="325" width="60" height="12" fill="#3178C6"/>
    <rect x="385" width="30" height="12" fill="#E34C26"/>
    <rect x="415" width="20" height="12" rx="6" fill="#89E051"/>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 95)" font-family="Consolas, 'Courier New', monospace" font-size="12">
    <!-- Col 1 -->

    <!-- Col 2 -->
    <g transform="translate(220, 0)">
      <circle cx="5" cy="5" r="5" fill="#E34C26"/>
      <text x="16" y="9" fill="#E2E8F0">HTML / CSS</text>
      <text x="110" y="9" fill="#94A3B8">6.5%</text>
    </g>
    <g transform="translate(220, 28)">
      <circle cx="5" cy="5" r="5" fill="#89E051"/>
      <text x="16" y="9" fill="#E2E8F0">Shell / Bash</text>

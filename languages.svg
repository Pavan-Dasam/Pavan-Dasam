      <text x="16" y="9" fill="#E2E8F0">Python</text>
      <text x="90" y="9" fill="#94A3B8">45.2%</text>
    </g>
    <g transform="translate(0, 28)">
      <circle cx="5" cy="5" r="5" fill="#B07219"/>
      <text x="16" y="9" fill="#E2E8F0">Java</text>
      <text x="90" y="9" fill="#94A3B8">30.0%</text>
    </g>
    <g transform="translate(0, 56)">

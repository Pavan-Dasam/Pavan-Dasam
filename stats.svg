<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="493" height="193" x="1" y="1" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Title -->
  <text x="30" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="17" font-weight="700" fill="url(#accentGrad)">
    ⚡ Pavan's GitHub Activity &amp; Stats
  </text>

  <!-- Items -->
  <g transform="translate(30, 68)" font-family="Consolas, 'Courier New', monospace" font-size="13">
    <!-- Total Stars -->
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="4" fill="#FBBF24"/>
      <text x="22" y="10" fill="#94A3B8">Total Stars Earned:</text>
      <text x="200" y="10" fill="#F8FAFC" font-weight="bold">12+</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 26)">
      <circle cx="6" cy="6" r="4" fill="#22D3EE"/>
      <text x="22" y="10" fill="#94A3B8">Total Commits (2024-26):</text>
      <text x="200" y="10" fill="#F8FAFC" font-weight="bold">480+</text>
    </g>

    <!-- Pull Requests -->
    <g transform="translate(0, 52)">
      <circle cx="6" cy="6" r="4" fill="#10B981"/>
      <text x="22" y="10" fill="#94A3B8">Total Pull Requests:</text>
      <text x="200" y="10" fill="#F8FAFC" font-weight="bold">45+</text>
    </g>

    <!-- Total Repositories -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="6" r="4" fill="#A855F7"/>
      <text x="22" y="10" fill="#94A3B8">Contributed Repos:</text>
      <text x="200" y="10" fill="#F8FAFC" font-weight="bold">20+</text>
    </g>
  </g>

  <!-- Rank Badge -->
  <g transform="translate(360, 65)">
    <circle cx="45" cy="45" r="40" fill="#1E1B4B" stroke="#7C3AED" stroke-width="2"/>
    <text x="45" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#22D3EE">A+</text>
    <text x="45" y="62" text-anchor="middle" font-family="monospace" font-size="10" fill="#A78BFA">RANK</text>
  </g>
</svg>

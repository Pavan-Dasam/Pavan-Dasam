<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B">
        <animate attributeName="stop-color" values="#1E1B4B;#311042;#4C1D95;#1E1B4B" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="35%" stop-color="#4C1D95">
        <animate attributeName="stop-color" values="#4C1D95;#6D28D9;#7C3AED;#4C1D95" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#2563EB;#6366F1;#7C3AED" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#C084FC;#00F0FF;#38BDF8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="headerGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes waveMove {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: url(#textGrad);
    }
    .subtitle-text {
      font-family: 'Courier New', Consolas, 'Fira Code', monospace;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: url(#subGrad);
    }
    .wave-back {
      animation: waveMove 6s ease-in-out infinite;
      opacity: 0.35;
    }
    .wave-front {
      animation: waveMove 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Wave Shape -->
  <path class="wave-back" d="M 0,0 L 1000,0 L 1000,165 C 800,210 600,140 400,195 C 200,235 100,170 0,190 Z" fill="url(#headerGrad)"/>
  <path class="wave-front" d="M 0,0 L 1000,0 L 1000,150 C 820,190 640,135 450,175 C 250,215 120,160 0,175 Z" fill="url(#headerGrad)"/>

  <!-- Grid overlay -->
  <path d="M 0,0 L 1000,0 L 1000,150 C 820,190 640,135 450,175 C 250,215 120,160 0,175 Z" fill="url(#headerGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="50" r="100" fill="#7C3AED" opacity="0.3" filter="url(#glow)"/>
  <circle cx="800" cy="70" r="120" fill="#38BDF8" opacity="0.25" filter="url(#glow)"/>

  <!-- Star Sparkles -->
  <circle cx="160" cy="45" r="1.5" fill="#FFFFFF" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="30" r="2" fill="#38BDF8" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="40" r="2" fill="#C084FC" opacity="0.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="25" r="1.5" fill="#FFFFFF" opacity="0.6"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.2s" repeatCount="indefinite"/></circle>

  <!-- Title & Subtitle -->
  <g transform="translate(500, 72)" text-anchor="middle">
    <text y="0" class="title-text" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.5))">PAVAN DASAM</text>
    <text y="38" class="subtitle-text" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.4))">AI ENGINEER · GENAI &amp; AGENTIC ARCHITECT</text>
  </g>
</svg>
